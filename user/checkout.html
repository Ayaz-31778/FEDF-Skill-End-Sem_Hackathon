<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | E-Shop</title><link rel="stylesheet" href="../css/style.css"></head>
<body><nav class="navbar"><a class="brand" href="dashboard.html">E-Shop</a><div class="nav-links"><a href="dashboard.html">Products</a><a href="cart.html">Cart</a><a href="orders.html">Orders</a><button id="logoutBtn" class="btn btn-danger small">Logout</button></div></nav>
<main class="container page"><div class="page-title"><div><p class="eyebrow">USER MODULE</p><h1>Checkout</h1><p class="muted">Confirm your delivery details and place your order.</p></div></div>
<div class="checkout-grid"><section class="panel"><h2>Delivery Details</h2><form id="checkoutForm">
<label for="fullName">Full Name</label><input id="fullName" autocomplete="name" required maxlength="80">
<label for="phone">Phone</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" minlength="10" maxlength="16" placeholder="Enter your contact number" required>
<label for="address">Delivery Address</label><textarea id="address" rows="4" autocomplete="street-address" maxlength="400" placeholder="House number, street, area, city and PIN code" required></textarea>
<label for="payment">Payment Method</label><select id="payment" required><option value="Cash on Delivery">Cash on Delivery</option><option value="UPI (Demo)">UPI (Demo simulation)</option><option value="Card (Demo)">Card (Demo simulation)</option></select>
<p class="muted checkout-demo-note">Demo checkout only: UPI and card selections simulate a successful payment. No real payment is collected.</p>
<button id="placeOrderBtn" class="btn btn-primary full" type="submit">Place Order</button><p id="checkoutMessage" class="form-message" role="status" aria-live="polite"></p>
</form></section><section class="panel"><h2>Order Summary</h2><div id="checkoutSummary"></div></section></div></main>
<script src="../js/storage.js"></script><script src="../js/orders.js"></script></body></html>
