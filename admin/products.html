<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#29362c"><title>Manage Products | Atelier Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css?v=atelier-catalogue-v5"></head>
<body class="atelier-dashboard atelier-admin-page">
<div class="atelier-announcement"><span>✳ ATELIER ADMIN STUDIO</span><span>THE GOOD FINDS EDIT · MANAGEMENT SPACE</span></div><nav class="navbar admin-nav atelier-admin-old-nav"><a class="brand" href="dashboard.html">atelier<span class="atelier-brand-dot">.</span><small class="atelier-admin-badge">ADMIN</small></a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a class="active" href="products.html">Products</a><a href="users.html">Users</a><a href="orders.html">Orders</a><button id="logoutBtn" class="btn btn-danger small">Logout</button></div></nav>
<main class="container page atelier-admin-main atelier-admin-products-main">
<div class="page-title"><div><p class="atelier-kicker">THE ATELIER CATALOGUE</p><h1>Product <em>management.</em></h1></div><button id="addProductBtn" class="btn btn-primary">+ Add Product</button></div>
<section id="productFormPanel" class="panel hidden"><h2 id="formTitle">Add Product</h2><form id="productForm" class="form-grid"><input type="hidden" id="productId"><div><label>Product Name</label><input id="productName" required></div><div><label>Price</label><input id="productPrice" type="number" min="1" required></div><div><label>Category</label><select id="productCategory"><option>Electronics</option><option>Fashion</option><option>Books</option><option>Home</option><option>Beauty</option><option>Everyday Finds</option><option>For Him</option></select></div><div><label>Stock</label><input id="productStock" type="number" min="0" required></div><div class="full-row"><label>Image URL (optional)</label><input id="productImage" placeholder="https://..."></div><div class="full-row"><label>Description</label><textarea id="productDescription" rows="3" required></textarea></div><div class="full-row form-actions"><button class="btn btn-primary" type="submit">Save Product</button><button id="cancelProduct" class="btn btn-outline" type="button">Cancel</button></div></form></section>
<section class="panel"><div id="adminProductsTable"></div></section>
</main><script src="../js/storage.js"></script><script src="../js/products.js"></script><script src="../js/admin.js"></script>
</body></html>
